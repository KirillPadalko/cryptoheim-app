<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoHeim Indicators</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Direct CSS links for static usage -->
    <link rel="stylesheet" href="./src/styles/main.css">
    <link rel="stylesheet" href="./src/styles/sections.css">
    <link rel="stylesheet" href="./src/styles/dashboard.css">

    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>

<body>
    <div class="noise-overlay"></div>
    <div id="app">
        <section class="hero" style="min-height: auto; padding: 60px 0 40px; border-bottom: none;">
            <div class="hero-bg"></div>
            <div class="container">
                <div class="logo-wrapper" style="width: 60px; height: 60px; margin-bottom: 20px;">
                    <img src="./src/assets/logo.png" alt="CryptoHeim Logo" class="logo-img">
                </div>
                <h1 class="hero-title" style="font-size: 3rem;">Web Indicators</h1>
                <p class="hero-slogan">Market Overview & Analytical Metrics</p>
                <div class="hero-buttons" style="margin-top: 1.5rem; display: flex; align-items: center; gap: 1.5rem; justify-content: center;">
                    <a href="index.html" class="btn-store" style="padding: 0.6rem 1.5rem; min-width: auto; margin: 0; font-size: 0.8rem;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                        Back
                    </a>
                    <div id="refresh-timer-container" class="refresh-timer-box">
                        <span class="timer-label">Next Update:</span>
                        <span id="refresh-timer" class="timer-value">--:--</span>
                        <div class="timer-progress-bg">
                            <div id="timer-progress-bar" class="timer-progress-fill"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="dashboard">
            <div class="container">
                <div class="dashboard-grid">
                    <!-- AI Market Forecast (Wider) -->
                    <div class="dashboard-card wide-card" id="forecast-block">
                        <div class="card-header">
                            <h3>AI Market Forecast</h3>
                            <span class="auto-update-badge">Live</span>
                        </div>
                        <div class="forecast-content" id="forecast-content">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>

                    <!-- News Summary -->
                    <div class="dashboard-card" id="news-block">
                        <div class="card-header">
                            <h3>News Summary</h3>
                        </div>
                        <div class="news-content" id="news-content"></div>
                    </div>

                    <!-- Market Scan -->
                    <div class="dashboard-card" id="market-scan-block">
                        <div class="card-header">
                            <h3>Market Scan</h3>
                        </div>
                        <div class="scan-content" id="scan-content"></div>
                    </div>

                    <!-- Sentiment & Season -->
                    <div class="dashboard-card" id="sentiment-block">
                        <div class="card-header">
                            <h3>Sentiment & Season</h3>
                        </div>
                        <div class="sentiment-metrics">
                            <div id="fear-greed" class="metric-box"></div>
                            <div id="alt-season" class="metric-box"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <div class="container">
                <p>CryptoHeim © 2025. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script type="module" src="./src/scripts/main.js"></script>
</body>

</html>
