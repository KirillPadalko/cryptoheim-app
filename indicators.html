<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoHeim Indicators</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Direct CSS links for static usage -->
    <link rel="stylesheet" href="./src/styles/main.css">
    <link rel="stylesheet" href="./src/styles/sections.css">
    <link rel="stylesheet" href="./src/styles/dashboard.css">

    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>

<body>
    <div class="noise-overlay"></div>
    <div id="app" class="streaming-layout">
        <!-- Compact Top Bar Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <img src="./src/assets/logo.png" alt="Logo" class="mini-logo">
                <div class="header-titles">
                    <h1>CryptoHeim Live</h1>
                    <p>Analytical Intelligence Dashboard</p>
                </div>
            </div>
            <div class="header-right">
                <div id="refresh-timer-container" class="refresh-timer-box">
                    <span class="timer-label">Next Sweep:</span>
                    <span id="refresh-timer" class="timer-value">--:--</span>
                    <div class="timer-progress-bg">
                        <div id="timer-progress-bar" class="timer-progress-fill"></div>
                    </div>
                </div>
                <a href="index.html" class="btn-mini-back">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </a>
            </div>
        </header>

        <section class="dashboard streaming-view">
            <div class="container-full">
                <div class="dashboard-grid streaming-grid">
                    <!-- Trading Bot Position Banner -->
                    <div class="dashboard-card" id="bot-position-block" style="padding: 1.25rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 0.75rem; margin-bottom: 1rem;">
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <span class="auto-update-badge" style="background: rgba(0, 255, 170, 0.1); color: var(--accent-highlight); animation: none; font-size: 0.7rem; padding: 0.2rem 0.5rem;">BOT</span>
                                <h3 style="margin: 0; font-size: 1.05rem; color: var(--text-main); font-weight: 600;">Active Trades</h3>
                            </div>
                            <div id="bot-pnl-container"></div>
                        </div>
                        <div class="position-content" id="position-content" style="flex: 1; width: 100%;">
                            <div class="loading-spinner" style="margin: 2rem auto; width: 24px; height: 24px;"></div>
                        </div>
                    </div>

                    <!-- AI Market Forecast (Wider) -->
                    <div class="dashboard-card wide-card" id="forecast-block">
                        <div class="card-header">
                            <h3>AI Market Forecast</h3>
                            <span class="auto-update-badge">Live</span>
                        </div>
                        <div class="forecast-content" id="forecast-content">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>

                    <!-- News Summary -->
                    <div class="dashboard-card" id="news-block">
                        <div class="card-header">
                            <h3>News Summary</h3>
                        </div>
                        <div class="news-content" id="news-content"></div>
                    </div>

                    <!-- Market Scan -->
                    <div class="dashboard-card" id="market-scan-block">
                        <div class="card-header">
                            <h3>Market Scan</h3>
                        </div>
                        <div class="scan-content" id="scan-content"></div>
                    </div>

                </div>
            </div>
        </section>
    </div>

    <script type="module" src="./src/scripts/main.js"></script>
</body>

</html>
