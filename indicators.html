<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoHeim Indicators</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Direct CSS links for static usage -->
    <link rel="stylesheet" href="./src/styles/main.css">
    <link rel="stylesheet" href="./src/styles/sections.css">
    <link rel="stylesheet" href="./src/styles/dashboard.css">

    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>

<body>
    <div class="noise-overlay"></div>
    <div id="app">
        <section class="hero" style="min-height: auto; padding: 60px 0 40px; border-bottom: none;">
            <div class="hero-bg"></div>
            <div class="container">
                <div class="logo-wrapper" style="width: 60px; height: 60px; margin-bottom: 20px;">
                    <img src="./src/assets/logo.png" alt="CryptoHeim Logo" class="logo-img">
                </div>
                <h1 class="hero-title" style="font-size: 3rem;">Web Indicators</h1>
                <p class="hero-slogan">Market Overview & Analytical Metrics</p>
                <div class="hero-buttons" style="margin-top: 1rem;">
                    <a href="index.html" class="btn-store" style="padding: 0.8rem 2rem; min-width: auto;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m15 18-6-6 6-6" />
                        </svg>
                        Back to Home
                    </a>
                </div>
            </div>
        </section>

        <section class="dashboard">
            <div class="container">
                <div class="dashboard-grid">
                    <!-- Block 1: 50 Coins with Sparklines -->
                    <div class="dashboard-card wide-card" id="assets-block">
                        <div class="card-header">
                            <h3>Market Overview</h3>
                            <span class="auto-update-badge">Live</span>
                        </div>
                        <div class="assets-carousel" id="assets-carousel">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>

                    <!-- Block 2: News Summary -->
                    <div class="dashboard-card" id="news-block">
                        <div class="card-header">
                            <h3>News Summary</h3>
                        </div>
                        <div class="news-content" id="news-content"></div>
                    </div>

                    <!-- Block 3: Market Scan (Leaders, RSI, etc) -->
                    <div class="dashboard-card" id="market-scan-block">
                        <div class="card-header">
                            <h3>Market Scan</h3>
                        </div>
                        <div class="scan-content" id="scan-content"></div>
                    </div>

                    <!-- Block 4: Sentiment Metrics -->
                    <div class="dashboard-card" id="sentiment-block">
                        <div class="card-header">
                            <h3>Sentiment & Season</h3>
                        </div>
                        <div class="sentiment-metrics">
                            <div id="fear-greed" class="metric-box"></div>
                            <div id="alt-season" class="metric-box"></div>
                        </div>
                    </div>

                    <!-- Block 5: Dominance Charts -->
                    <div class="dashboard-card wide-card" id="dominance-block">
                        <div class="card-header">
                            <h3>Dominance</h3>
                        </div>
                        <div class="chart-container" style="position: relative; height:300px; width:100%">
                            <canvas id="dominanceChart"></canvas>
                        </div>
                    </div>

                    <!-- Block 6: Global Markets -->
                    <div class="dashboard-card" id="global-markets-block">
                        <div class="card-header">
                            <h3>Global Markets</h3>
                        </div>
                        <div class="global-metrics" id="global-metrics-content"></div>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <div class="container">
                <p>CryptoHeim © 2025. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <script type="module" src="./src/scripts/main.js"></script>
</body>

</html>
