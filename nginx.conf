server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index indicators.html;

    # Map the root domain to indicators.html
    location = / {
        try_files /indicators.html =404;
    }

    # Redirect any requests for the old index.html to the root domain
    location = /index.html {
        return 301 /;
    }

    # Handle standard multi-page HTML routing
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache assets for high performance
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
